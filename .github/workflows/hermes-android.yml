name: React Native Hermes Android smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - verification/hermes/**
      - .github/workflows/hermes-android.yml
      - src/**
      - package.json
      - pnpm-lock.yaml
      - "**config*"

permissions:
  contents: read

jobs:
  hermes-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.8.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:hermes-harness
      - name: Pack exact candidate
        run: |
          pnpm build
          mkdir "$RUNNER_TEMP/daykeeper-packed"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/daykeeper-packed" > "$RUNNER_TEMP/daykeeper-packed/pack.json"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$RUNNER_TEMP/daykeeper-packed/pack.json"
      - name: Enable acceleration on disposable runner
        run: |
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run bundled Hermes app on API 35 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-port: 5554
          disable-linux-hw-accel: "false"
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048
          script: node verification/hermes/run.mjs --execute "$RUNNER_TEMP/daykeeper-packed/pack.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: hermes-android-receipt
          path: hermes-smoke-results/receipt.json
          if-no-files-found: error
