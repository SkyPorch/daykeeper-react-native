name: React Native Hermes iOS smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - verification/hermes/**
      - .github/workflows/hermes-ios.yml
      - src/**
      - package.json
      - pnpm-lock.yaml
      - "**config*"

permissions:
  contents: read

jobs:
  hermes-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.8.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:hermes-harness
      - name: Pack exact candidate
        run: |
          pnpm build
          mkdir "$RUNNER_TEMP/daykeeper-packed"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/daykeeper-packed" > "$RUNNER_TEMP/daykeeper-packed/pack.json"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$RUNNER_TEMP/daykeeper-packed/pack.json"
      - name: Create disposable iOS simulator
        id: simulator
        run: |
          set -euo pipefail
          runtime=$(xcrun simctl list runtimes -j | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).runtimes.filter(x=>x.isAvailable&&x.identifier.startsWith("com.apple.CoreSimulator.SimRuntime.iOS-")); if(!r.length) process.exit(1); r.sort((a,b)=>a.version.localeCompare(b.version,undefined,{numeric:true})); process.stdout.write(r.at(-1).identifier)})')
          device_type=$(xcrun simctl list devicetypes -j | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s).devicetypes.find(x=>x.name==="iPhone 16")||JSON.parse(s).devicetypes.find(x=>x.name.startsWith("iPhone ")); if(!d) process.exit(1); process.stdout.write(d.identifier)})')
          name="DaykeeperHermesSmoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          udid=$(xcrun simctl create "$name" "$device_type" "$runtime")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Run bundled Hermes app on iOS Simulator
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          SIMULATOR_NAME: ${{ steps.simulator.outputs.name }}
        run: node verification/hermes/ios/run.mjs --execute "$RUNNER_TEMP/daykeeper-packed/pack.json"
      - name: Delete disposable iOS simulator
        if: always() && steps.simulator.outputs.udid != ''
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl shutdown "$SIMULATOR_UDID" || true
          xcrun simctl delete "$SIMULATOR_UDID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: hermes-ios-receipt
          path: hermes-smoke-results/ios-receipt.json
          if-no-files-found: error
