name: Stage npm release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check and package without publishing credentials or provenance
        type: boolean
        default: true
      ref:
        description: Git ref to check out for the dry run (defaults to the caller ref)
        type: string
        required: false

permissions:
  contents: read

jobs:
  dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deliberately no production environment or OIDC permission: checked-out
    # code and install scripts can run, but cannot obtain publishing credentials.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install --global npm@11.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: npm publish --dry-run --provenance=false --access public
  refuse-manual-publish:
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "::error::Manual runs only support dry runs; publish a GitHub release to stage a package." >&2
          exit 1
  stage:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: daykeeper-npm-production
    permissions:
      contents: read
      # Required for npm provenance via OIDC. No long-lived npm token is used.
      id-token: write
    steps:
      # A release can be published from any tag, including one pushed to an
      # unreviewed branch or to no branch at all. Prove the tag is on main
      # before any repository code is checked out or executed.
      - name: Check out main for tag verification
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # Credentials are kept only so the verification step below can fetch
          # the tag ref; they are dropped again for the tag checkout.
      - name: Verify the release tag is an ancestor of main
        id: verified
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARGET_COMMITISH: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail
          if [ "${TARGET_COMMITISH}" != "main" ]; then
            echo "::error::Release targets '${TARGET_COMMITISH}', not main." >&2
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag." >&2
            exit 1
          fi
          git fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main"
          git fetch --no-tags --force origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          echo "Tag ${RELEASE_TAG} -> ${tag_sha}"
          echo "origin/main -> ${main_sha}"
          if ! git merge-base --is-ancestor "${tag_sha}" refs/remotes/origin/main; then
            echo "::error::Tag ${RELEASE_TAG} (${tag_sha}) is not an ancestor of origin/main; refusing to publish." >&2
            exit 1
          fi
          echo "sha=${tag_sha}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.verified.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install --global npm@11.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/verify-release.mjs
      - name: Stage package for npm review
        run: npm stage publish --access public --provenance --tag "${{ github.event.release.prerelease && 'next' || 'latest' }}"
